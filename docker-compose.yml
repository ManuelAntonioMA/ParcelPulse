services:
  postgres:
    image: postgres:16-alpine
    container_name: parcelpulse-postgres
    environment:
      POSTGRES_DB: parcelpulse
      POSTGRES_USER: parcelpulse
      POSTGRES_PASSWORD: parcelpulse_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcelpulse -d parcelpulse"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: parcelpulse-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: